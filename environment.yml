name: popy
channels:
  - conda-forge
dependencies:
  - python=3.10.13
  - pip
  # Compiled packages come from conda-forge so their binaries are built against
  # the same NumPy and load on recent macOS. Keep NumPy below 2.
  - numpy=1.26.4
  - pandas=2.0.1
  - scipy=1.15.2
  - scikit-learn=1.6.1
  - statsmodels=0.14.4
  - matplotlib=3.10.0
  - netcdf4=1.6.5
  - pip:
      - seaborn==0.13.2
      - xarray==2023.9.0
      - gymnasium==1.0.0
      - scikit-optimize==0.10.2
      - imbalanced-learn==0.13.0
      - joblib==1.4.2
      - tqdm==4.67.1
      - openpyxl==3.1.5
      - ipykernel==6.29.5
      - jupyter
